name: CI

on:
  push:
    branches: master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2

      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "0.15.12"
          spago: "0.93.44"

      - run: spago build --pedantic-packages

      - run: spago test --pedantic-packages
